<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" />
  <title>늑구를 구조해줘!</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sun" aria-hidden="true">☀️</div>
  <div class="cloud cloud-a" aria-hidden="true">☁️</div>
  <div class="cloud cloud-b" aria-hidden="true">☁️</div>
  <div class="cloud cloud-c" aria-hidden="true">☁️</div>
  <div class="forest" aria-hidden="true">
    <span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span>
  </div>
  <div class="meadow" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="title-wrap">
        <h1 class="title">
          <span class="title-emoji" aria-hidden="true">🐺</span>
          <span class="title-text">늑구를 구조해줘!</span>
        </h1>
        <p class="subtitle">지뢰밭을 조심스럽게 열어 길을 만들고, 늑구에게 도달하세요</p>
      </div>
      <div class="controls">
        <div class="stat">
          <span class="stat-icon" aria-hidden="true">💣</span>
          <div class="stat-col">
            <span class="stat-label">지뢰</span>
            <span id="mineCount" class="stat-value">--</span>
          </div>
        </div>
        <div class="stat">
          <span class="stat-icon" aria-hidden="true">⏱️</span>
          <div class="stat-col">
            <span class="stat-label">시간</span>
            <span id="timer" class="stat-value">0</span>
          </div>
        </div>
        <button id="modeBtn" class="btn icon-btn mobile-only" title="탭 모드 전환 (열기 / 깃발)">👆</button>
        <button id="menuBtn" class="btn icon-btn mobile-only" title="메뉴 열기" aria-expanded="false" aria-controls="controlsMenu">☰</button>

        <div id="controlsMenu" class="controls-menu">
          <select id="difficulty" class="select" title="난이도 (지뢰 밀도)">
            <option value="easy">쉬움 · 지뢰 12%</option>
            <option value="normal" selected>보통 · 지뢰 16%</option>
            <option value="hard">어려움 · 지뢰 20%</option>
          </select>
          <label class="tile-slider" title="타일 크기 조절">
            <span class="tile-slider-icon" aria-hidden="true">🔳</span>
            <input id="tileSize" class="tile-slider-range" type="range" min="14" max="60" step="2" value="34" />
            <span id="tileSizeVal" class="tile-slider-val">34px</span>
          </label>
          <select id="wolves" class="select" title="늑구 마리 수">
            <option value="1" selected>🐺 1마리</option>
            <option value="2">🐺 2마리</option>
            <option value="3">🐺 3마리</option>
            <option value="4">🐺 4마리</option>
            <option value="5">🐺 5마리</option>
          </select>
          <button id="muteBtn" class="btn icon-btn" title="효과음 on/off">🔊</button>
          <button id="rankBtn" class="btn" title="랭킹 보기">🏆 랭킹</button>
          <button id="userBtn" class="btn" title="사용자명 변경">
            <span aria-hidden="true">👤</span>
            <span id="userBtnName">이름 설정</span>
          </button>
          <button id="resetBtn" class="btn primary">🔁 새 게임</button>
        </div>
      </div>
    </header>

    <div id="rankModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="rankModalTitle">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <div class="modal-head">
          <h2 id="rankModalTitle" class="modal-title">🏆 구조자 랭킹</h2>
          <button class="btn icon-btn" data-close title="닫기">✖️</button>
        </div>
        <div id="rankList" class="rank-list">불러오는 중…</div>
        <div class="modal-foot">
          <button id="rankRefreshBtn" class="btn">🔄 새로고침</button>
        </div>
      </div>
    </div>

    <div id="userModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
      <div class="modal-backdrop" data-close></div>
      <div class="modal-panel">
        <div class="modal-head">
          <h2 id="userModalTitle" class="modal-title">👤 사용자명 입력</h2>
          <button class="btn icon-btn" data-close title="닫기">✖️</button>
        </div>
        <p class="modal-desc">랭킹에 기록될 이름을 입력하세요 (최대 20자).</p>
        <input id="userInput" class="text-input" type="text" maxlength="20" placeholder="예: 늑구지킴이" />
        <div class="modal-foot">
          <button id="userSaveBtn" class="btn primary">저장</button>
        </div>
      </div>
    </div>

    <main class="board-wrap">
      <div class="board-scroll">
        <div id="board" class="board"></div>
      </div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <div id="overlayIcon" class="overlay-icon"></div>
          <div id="overlayTitle" class="overlay-title"></div>
          <div id="overlayMsg" class="overlay-msg"></div>
          <button id="overlayBtn" class="btn primary big">🔁 다시 도전</button>
        </div>
      </div>
    </main>

    <footer class="hint">
      <span>🖱️ 좌클릭: 열기</span>
      <span>🚩 우클릭: 깃발</span>
      <span>🔢 숫자 셀 좌클릭(주변 깃발=숫자): 주변 자동 열기</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
