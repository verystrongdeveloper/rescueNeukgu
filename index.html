<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>늑구를 구조해줘!</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="sun" aria-hidden="true">☀️</div>
  <div class="cloud cloud-a" aria-hidden="true">☁️</div>
  <div class="cloud cloud-b" aria-hidden="true">☁️</div>
  <div class="cloud cloud-c" aria-hidden="true">☁️</div>
  <div class="forest" aria-hidden="true">
    <span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span><span>🌲</span><span>🌳</span>
  </div>
  <div class="meadow" aria-hidden="true"></div>

  <div class="app">
    <header class="header">
      <div class="title-wrap">
        <h1 class="title">
          <span class="title-emoji" aria-hidden="true">🐺</span>
          <span class="title-text">늑구를 구조해줘!</span>
        </h1>
        <p class="subtitle">지뢰밭을 조심스럽게 열어 길을 만들고, 늑구에게 도달하세요</p>
      </div>
      <div class="controls">
        <div class="stat">
          <span class="stat-icon" aria-hidden="true">💣</span>
          <div class="stat-col">
            <span class="stat-label">지뢰</span>
            <span id="mineCount" class="stat-value">--</span>
          </div>
        </div>
        <div class="stat">
          <span class="stat-icon" aria-hidden="true">⏱️</span>
          <div class="stat-col">
            <span class="stat-label">시간</span>
            <span id="timer" class="stat-value">0</span>
          </div>
        </div>
        <select id="difficulty" class="select" title="난이도">
          <option value="easy">쉬움 · 10×10 · 지뢰 12</option>
          <option value="normal" selected>보통 · 16×16 · 지뢰 40</option>
          <option value="hard">어려움 · 20×20 · 지뢰 75</option>
        </select>
        <select id="wolves" class="select" title="늑구 마리 수">
          <option value="1" selected>🐺 1마리</option>
          <option value="2">🐺 2마리</option>
          <option value="3">🐺 3마리</option>
          <option value="4">🐺 4마리</option>
          <option value="5">🐺 5마리</option>
        </select>
        <button id="muteBtn" class="btn icon-btn" title="효과음 on/off">🔊</button>
        <button id="resetBtn" class="btn primary">🔁 새 게임</button>
      </div>
    </header>

    <main class="board-wrap">
      <div id="board" class="board" oncontextmenu="return false;"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-content">
          <div id="overlayIcon" class="overlay-icon"></div>
          <div id="overlayTitle" class="overlay-title"></div>
          <div id="overlayMsg" class="overlay-msg"></div>
          <button id="overlayBtn" class="btn primary big">🔁 다시 도전</button>
        </div>
      </div>
    </main>

    <footer class="hint">
      <span>🖱️ 좌클릭: 열기</span>
      <span>🚩 우클릭: 깃발</span>
      <span>🔢 숫자 셀 좌클릭(주변 깃발=숫자): 주변 자동 열기</span>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
</html>
